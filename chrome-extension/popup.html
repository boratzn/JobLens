<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>İlanAnaliz Chrome Eklentisi</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }
    .logo span {
      color: #60a5fa;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0f172a;
      color: #fff;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #93c5fd;
      line-height: 1.4;
    }
    .error {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">İlan<span>Analiz</span></div>
    <span style="font-size:11px;color:#64748b;">v1.0</span>
  </div>

  <label for="serverUrl">Uygulama Sunucu Adresi:</label>
  <input id="serverUrl" type="text" value="http://localhost:3000" placeholder="https://uygulama-adresiniz.vercel.app" />

  <button id="analyzeBtn">🚀 Açık Sayfadaki İlanı Analiz Et</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
